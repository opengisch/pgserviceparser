name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.15"

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install pgserviceparser with test dependencies
        run: pip install -e ".[gui]"

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Run Python tests
        env:
          PGSERVICEPARSER_SRC_DIR: ${{ github.workspace }}
        run: |
          python -m unittest test.test_lib

      - name: Run GUI tests
        env:
            PGSERVICEPARSER_SRC_DIR: ${{ github.workspace }}
            QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test.test_gui
